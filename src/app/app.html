<app-confirm-host></app-confirm-host>
<div class="min-h-screen">
  <!-- Header -->
  <header class="bg-white/70 backdrop-blur-md border-b border-slate-200 sticky top-0 z-10">
    <div class="max-w-6xl mx-auto px-4 sm:px-6 py-4 flex flex-col sm:flex-row sm:items-center justify-between gap-3">
      <div class="flex items-center gap-3">
        <span class="w-10 h-10 rounded-xl bg-gradient-to-br from-indigo-500 to-purple-600 text-white flex items-center justify-center shadow-md">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2v20"/>
            <path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/>
          </svg>
        </span>
        <div>
          <h1 class="text-xl font-bold text-slate-800">Control de Gastos</h1>
          <p class="text-xs text-slate-500">Gestioná tus ingresos y gastos mensuales</p>
        </div>
      </div>
      <app-month-selector></app-month-selector>
    </div>
  </header>

  <main class="max-w-6xl mx-auto px-4 sm:px-6 py-6 space-y-8">
    <!-- Tarjetas resumen -->
    <app-summary-cards></app-summary-cards>

    <!-- Resumen USD (se oculta si no hay cuotas USD) -->
    <app-usd-summary></app-usd-summary>

    <!-- Layout principal -->
    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
      <!-- Columna izquierda: Formulario, tarjetas, suscripciones y categorías -->
      <div class="lg:col-span-1 space-y-8">
        <app-transaction-form></app-transaction-form>
        <app-cards-manager></app-cards-manager>
        <app-subscriptions-manager></app-subscriptions-manager>
        <app-category-breakdown></app-category-breakdown>
        <app-data-backup></app-data-backup>
      </div>

      <!-- Columna derecha: Fijos guardados + Lista de movimientos -->
      <div class="lg:col-span-2 space-y-8">
        <app-recurring-templates></app-recurring-templates>
        <app-transaction-list></app-transaction-list>
      </div>
    </div>

    <footer class="text-center text-xs text-slate-400 py-4">
      Hecho con Angular 21 y Tailwind CSS
    </footer>
  </main>
</div>
