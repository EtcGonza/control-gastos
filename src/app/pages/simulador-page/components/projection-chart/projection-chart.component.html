@if (result && result.months.length > 0) {
  <div class="bg-white rounded-2xl shadow-sm border border-slate-100 p-6">
    <div class="flex items-center justify-between mb-3">
      <h3 class="text-lg font-semibold text-slate-800">Flujo proyectado</h3>
      <div class="flex flex-wrap gap-x-3 gap-y-1 text-[11px] text-slate-600">
        <span class="flex items-center gap-1.5">
          <span class="w-3 h-3 rounded-sm bg-slate-300"></span> Fijos actuales
        </span>
        <span class="flex items-center gap-1.5">
          <span class="w-3 h-3 rounded-sm bg-violet-500"></span> Compra simulada
        </span>
        <span class="flex items-center gap-1.5">
          <span class="w-3 h-0.5 bg-emerald-500"></span> Ingresos
        </span>
      </div>
    </div>

    <div class="overflow-x-auto">
      <svg [attr.viewBox]="'0 0 ' + W + ' ' + H"
           class="w-full h-[280px] min-w-[640px]"
           preserveAspectRatio="xMidYMid meet">
        <!-- Grid horizontal + ejes Y -->
        @for (g of gridY(); track g.y) {
          <line [attr.x1]="padL" [attr.x2]="W - padR"
                [attr.y1]="g.y" [attr.y2]="g.y"
                stroke="#e2e8f0" stroke-width="1" stroke-dasharray="2 3"/>
          <text [attr.x]="padL - 6" [attr.y]="g.y + 3"
                text-anchor="end" font-size="10" fill="#94a3b8">
            {{ formatCompact(g.value) }}
          </text>
        }

        <!-- Barras apiladas: fijos actuales (slate) + simulación (violeta) -->
        @for (m of result.months; track m.month; let i = $index) {
          <!-- Base: gastos fijos actuales -->
          <rect [attr.x]="barX(i)"
                [attr.y]="yOf(m.existingFixedExpenses)"
                [attr.width]="barW()"
                [attr.height]="barH(m.existingFixedExpenses)"
                fill="#cbd5e1" rx="2"/>
          <!-- Encima: impacto de la compra -->
          <rect [attr.x]="barX(i)"
                [attr.y]="yOf(m.totalFixedExpenses)"
                [attr.width]="barW()"
                [attr.height]="barH(m.simulationImpact)"
                fill="#8b5cf6" rx="2"/>
        }

        <!-- Línea de ingresos proyectados -->
        <path [attr.d]="incomeLinePath()"
              fill="none" stroke="#059669" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round"/>

        <!-- Dots de ingreso por mes -->
        @for (m of result.months; track m.month; let i = $index) {
          <circle [attr.cx]="centerX(i)" [attr.cy]="yOf(m.projectedIncome)"
                  r="2.5" fill="#059669"/>
        }

        <!-- Eje X: labels -->
        @for (m of result.months; track m.month; let i = $index) {
          <text [attr.x]="centerX(i)" [attr.y]="H - 8"
                text-anchor="middle" font-size="10" fill="#64748b">
            {{ m.label }}
          </text>
        }
      </svg>
    </div>
  </div>
}
